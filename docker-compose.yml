version: '3'

services:
  prometheus: 
    image: prom/prometheus:latest
    container_name: prometheus
    ports: 
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring
  
#  node_exporter:
#    image: prom/node-exporter:latest
#    container_name: node_exporter
#    command: --web.listen-address=:9002
#    ports:
#      - "9002:9002"
#    networks:
#      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    command: -port=8081
    ports:
      - "8080:8080"
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:rw
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    networks: 
      -  monitoring
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_PASSWORD_ADMIN=admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - prometheus
    
networks:
  monitoring: 
    driver: bridge

volumes:
  grafana-storage:
    driver: local
